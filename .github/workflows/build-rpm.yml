name: Build RPM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    name: Build RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    container:
      image: fedora:latest
    steps:
      # git must be in PATH BEFORE checkout, or it falls back to
      # the REST API and no .git directory is created
      - name: Install build deps
        run: |
          dnf install -y cargo rust-packaging rpm-build rpmlint xz git \
            openssl-devel

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Allow git in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM
        run: ./rpm-build.sh

      - name: Lint spec + RPM
        continue-on-error: true
        run: ./rpm-build.sh lint

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: telegram-vpn-bot-rpm-${{ matrix.arch }}
          path: |
            ${{ github.workspace }}/rpmbuild/RPMS/${{ matrix.arch }}/telegram-vpn-bot-*.rpm
            ${{ github.workspace }}/rpmbuild/SRPMS/telegram-vpn-bot-*.src.rpm

      - name: Attach RPM to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.workspace }}/rpmbuild/RPMS/${{ matrix.arch }}/telegram-vpn-bot-*.${{ matrix.arch }}.rpm
