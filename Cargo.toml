[package]
name = "telegram-vpn-bot"
version = "0.2.0"
edition = "2021"

[profile.release]
strip = true

[dependencies]
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
tokio = { version = "1", features = ["net", "signal", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", features = ["parse", "serde"], default-features = false }
defguard_wireguard_rs = { version = "0.12", default-features = false }
nlink = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std", "env-filter"] }
tracing-journald = "0.3"
async-trait = "0.1"
libc = "0.2.186"
html-escape = "0.2"
